version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crs_pulse_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - crs_pulse_network
    depends_on:
      - db
      - redis
    environment:
      - PHP_OPCACHE_ENABLE=1

  nginx:
    image: nginx:1.25-alpine
    container_name: crs_pulse_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - crs_pulse_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: crs_pulse_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-crs_pulse}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: ${DB_USERNAME:-crs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-crs_secret}
    volumes:
      - crs_pulse_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - crs_pulse_network

  redis:
    image: redis:7.2-alpine
    container_name: crs_pulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - crs_pulse_redis_data:/data
    networks:
      - crs_pulse_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crs_pulse_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - crs_pulse_network
    depends_on:
      - db
      - redis
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crs_pulse_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - crs_pulse_network
    depends_on:
      - db
      - redis
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"

  mailpit:
    image: axllent/mailpit:latest
    container_name: crs_pulse_mail
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - crs_pulse_network

networks:
  crs_pulse_network:
    driver: bridge

volumes:
  crs_pulse_db_data:
    driver: local
  crs_pulse_redis_data:
    driver: local
