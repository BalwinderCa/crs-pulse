# Per-program document checklists, reached from the side menu. No profile needed.
steps:
  - echo: goldie clears app data once per device, not per flow, so onboarding is
  - echo: already dismissed by the first scene (store-01-draws). Gate on a Home marker.
  - launch: com.crspulse.app
  - await: { visible: { text: Recent Draws } }
  - await: { idle: true }
  - echo: Hamburger in the header; its accessibility label is "Open menu".
  - tap: { text: Open menu }
  - await: { visible: { text: Document Checklists } }
  - tap: { text: Document Checklists }
  - await: { idle: true }
