name = "crs-pulse-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Allow heartbeat subrequests to opt out of Cloudflare's cache. Keeping this as
# a narrow compatibility flag avoids changing unrelated runtime behaviour.
compatibility_flags = ["cache_option_enabled"]
# Privacy-first project — opt out of Wrangler's anonymous telemetry.
send_metrics = false

[[kv_namespaces]]
binding = "TOKENS_KV"
id = "588cfb0021b2409e9f5dc1083b0497e8"
preview_id = "51b5f45ff4034592bda05af1ebc4dfab"

[triggers]
crons = ["*/15 * * * *"]

# Keeps the per-draw delivery counts (see the draw_push log in checkAndNotify)
# queryable in the dashboard. Nothing user-identifying is logged.
[observability]
enabled = true

# Production secrets (set via wrangler, never commit):
#   wrangler secret put PUSH_API_SECRET   # protects /register and /revoke
#   wrangler secret put SYNC_SECRET       # protects POST /sync
#   wrangler secret put RESEND_API_KEY    # Resend key for email alerts (draws + processing-time changes)
#   wrangler secret put EMAIL_FROM        # verified sender, e.g. CRS Pulse <alerts@send.crspulse.com>
#   wrangler secret put GITHUB_DISPATCH_TOKEN  # fine-grained PAT, repo crs-pulse, Actions: read+write
#                                              # (drives the IRCC mirror on time — GitHub's own cron drops ~90% of ticks)
# Email dispatch is skipped entirely unless BOTH RESEND_API_KEY and EMAIL_FROM are set.

# Community timelines (src/community.ts). Schema: migrations/0001_community.sql,
# applied with `npx wrangler d1 migrations apply crs-pulse-community --remote`.
[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "crs-pulse-community"
database_id = "56ae7b09-b5d2-4c20-8a75-372f2746bb65"
migrations_dir = "migrations"
