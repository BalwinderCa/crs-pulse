name = "crs-pulse-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Privacy-first project — opt out of Wrangler's anonymous telemetry.
send_metrics = false

[[kv_namespaces]]
binding = "TOKENS_KV"
id = "588cfb0021b2409e9f5dc1083b0497e8"
preview_id = "51b5f45ff4034592bda05af1ebc4dfab"

[triggers]
crons = ["*/15 * * * *"]

# Production secrets (set via wrangler, never commit):
#   wrangler secret put PUSH_API_SECRET   # protects /register and /revoke
#   wrangler secret put SYNC_SECRET       # protects POST /sync
#   wrangler secret put RESEND_API_KEY    # Resend key for email alerts (draws + processing-time changes)
#   wrangler secret put EMAIL_FROM        # verified sender, e.g. CRS Pulse <alerts@send.crspulse.com>
#   wrangler secret put GITHUB_DISPATCH_TOKEN  # fine-grained PAT, repo crs-pulse, Actions: read+write
#                                              # (drives the IRCC mirror on time — GitHub's own cron drops ~90% of ticks)
# Email dispatch is skipped entirely unless BOTH RESEND_API_KEY and EMAIL_FROM are set.
