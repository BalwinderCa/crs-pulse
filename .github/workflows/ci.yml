name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: Mobile — test, lint, type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Jest tests (enforces coverage thresholds)
        run: npm run test:coverage

  push-worker:
    name: Push worker — type-check & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/push
    steps:
      - uses: actions/checkout@v4

      # Node 24 runs the worker's TypeScript tests directly via type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/push/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Node tests
        run: npm test

  website:
    name: Website — build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Builds the site and asserts the agent surface: markdown twins, JSON-LD,
      # sitemap/robots/llms.txt, the 404, and that vercel.json + middleware.js still
      # cover every route. web/assets/frame is not in this public repo (Apple licence),
      # so build.mjs skips that one image under GITHUB_ACTIONS — the generated HTML and
      # markdown the tests check are identical either way.
      - name: Build & test
        run: npm test

  scripts:
    name: Mirror scripts — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test mirror scripts
        run: node --test .github/scripts/*.test.mjs
