name: IRCC draw mirror

# canada.ca (Akamai) rejects Cloudflare Worker egress (HTTP 520), so the push
# worker cannot poll IRCC directly. This job runs on GitHub-hosted runners
# (accepted egress), mirrors the latest draw into data/latest-draw.json, and the
# worker reads it from raw.githubusercontent.com.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: 'Redeploy crspulse.com even if the draw data has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ircc-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each IRCC fetch is independent: canada.ca (Akamai) intermittently times
      # out, and a transient blip on one feed must not skip the other or the
      # commit. continue-on-error keeps the job green; the cron retries every 15m.
      - name: Fetch latest IRCC draw
        id: fetch_draw
        continue-on-error: true
        run: node .github/scripts/fetch-latest-draw.mjs

      - name: Fetch IRCC processing times
        id: fetch_times
        if: always()
        continue-on-error: true
        run: node .github/scripts/fetch-processing-times.mjs

      - name: Commit if changed
        id: commit
        if: always()
        run: |
          # The website bakes data/ee-rounds.json in at build time, so only a change to
          # *that* file is worth a redeploy — processing times are app-only.
          if git diff --quiet -- data/ee-rounds.json; then
            echo "site=false" >> "$GITHUB_OUTPUT"
          else
            echo "site=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- data/latest-draw.json data/ee-rounds.json data/processing-times.json; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-draw.json data/ee-rounds.json data/processing-times.json
          git commit -m "chore(data): update IRCC draw + processing times [skip ci]"
          git push

      # A new round changes every draw figure on crspulse.com, but the site is static:
      # the numbers only move when it is rebuilt. The redeploy lives here rather than in
      # a push-triggered workflow because the commit above carries [skip ci], which would
      # suppress one. The Vercel project has no Git connection, so this is the CLI, not a
      # deploy hook. Without VERCEL_TOKEN set the step is skipped and the mirror still
      # commits — the site just waits for a manual `vercel --prod`.
      - name: Redeploy the website with the new draw
        id: redeploy
        if: (steps.commit.outputs.site == 'true' || inputs.force_redeploy) && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_YK7kSy1qWtXPCwWsEcaBZ2eJ
          VERCEL_PROJECT_ID: prj_AHUE6t4xiHAIjHKF5hWHBuBchr2Y
        run: |
          set -euo pipefail
          # Apple's Product Bezels image is licensed to show our own app but must not
          # enter this public repo, so it is absent from the checkout. Its licensed home
          # is the live site, which is where we pull it back from. ponytail: if a deploy
          # ever ships without it this breaks — recover with a local `vercel --prod`
          # from a working copy that still has web/assets/frame/.
          mkdir -p web/assets/frame
          curl -fsS --retry 3 --retry-delay 2 --max-time 60 \
            https://www.crspulse.com/img/iphone17pro.png -o web/assets/frame/iphone17pro.png
          test -s web/assets/frame/iphone17pro.png

          # Vercel's own failure here is "Could not retrieve Project Settings", which
          # sounds like a linking problem but actually means the token cannot see this
          # project. Check first so the log says which.
          http=$(curl -s -o /tmp/vercel-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          if [ "$http" != "200" ]; then
            echo "::error::VERCEL_TOKEN cannot read $VERCEL_PROJECT_ID in $VERCEL_ORG_ID (HTTP $http) — recreate the token scoped to that team."
            head -c 400 /tmp/vercel-project.json
            exit 1
          fi

          # VERCEL_ORG_ID / VERCEL_PROJECT_ID alone are not enough for CLI 54 here: it
          # still reports "Could not retrieve Project Settings" (the API check above
          # proves the token can read the project). Write the link file the CLI reads
          # locally — .vercel is gitignored, so this only exists for the run.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"crs-pulse"}' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

          for ep in v2/user v2/teams "v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"; do
            echo "  $ep -> $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/$ep")"
          done

          npx --yes vercel@54 --prod --yes \
            --scope balwinder-singhs-projects-04717683 --token "$VERCEL_TOKEN"

      # continue-on-error keeps the job running through a transient blip on one
      # feed, but a *persistent* fetch failure must not look green (that's how the
      # spoofed-UA outage hid for ~4 weeks). Turn the run red if either fetch failed.
      - name: Fail the run if a fetch failed (surface silent mirror outages)
        if: always()
        run: |
          echo "fetch outcomes — draw: ${{ steps.fetch_draw.outcome }}, times: ${{ steps.fetch_times.outcome }}"
          if [ "${{ steps.fetch_draw.outcome }}" != "success" ] || [ "${{ steps.fetch_times.outcome }}" != "success" ]; then
            echo "::error::IRCC mirror fetch failed — committed data may be stale."
            exit 1
          fi
          # A silently-failing redeploy would leave the site showing an old draw
          # indefinitely, which is the failure this step exists to prevent.
          if [ "${{ steps.redeploy.outcome }}" = "failure" ]; then
            echo "::error::Website redeploy failed — crspulse.com is still on the previous draw."
            exit 1
          fi
