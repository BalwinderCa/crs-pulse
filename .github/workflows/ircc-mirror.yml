name: IRCC draw mirror

# canada.ca (Akamai) rejects Cloudflare Worker egress (HTTP 520), so the push
# worker cannot poll IRCC directly. This job runs on GitHub-hosted runners
# (accepted egress), mirrors the latest draw into data/latest-draw.json, and the
# worker reads it from raw.githubusercontent.com.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ircc-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest IRCC draw
        run: node .github/scripts/fetch-latest-draw.mjs

      # Processing times change ~monthly; a failure here must not block the draw
      # mirror, so don't fail the job if IRCC is briefly unreachable.
      - name: Fetch IRCC processing times
        run: node .github/scripts/fetch-processing-times.mjs || echo "processing-times fetch failed — keeping previous data"

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/latest-draw.json data/processing-times.json; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-draw.json data/processing-times.json
          git commit -m "chore(data): update IRCC draw + processing times [skip ci]"
          git push
